name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            built: target/release/ilm
            asset: ilm-linux-x86_64
            rustflags: ""
          - os: windows-latest
            built: target/release/ilm.exe
            asset: ilm-windows-x86_64.exe
            # the C runtime inside the program, so that it runs without the Visual C++ Redistributable
            rustflags: "-C target-feature=+crt-static"
          - os: macos-latest
            built: target/release/ilm
            asset: ilm-macos-arm64
            rustflags: ""
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Name the program for the release
        shell: bash
        run: cp "${{ matrix.built }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: programs
          merge-multiple: true
      - name: The SHA-256 of the programs
        run: cd programs && sha256sum ilm-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release with its files
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" programs/* LICENSE THIRD_PARTY_NOTICES.md
          --repo "$GITHUB_REPOSITORY"
          --title "ILM $GITHUB_REF_NAME"
          --notes "The programs of ILM $GITHUB_REF_NAME: Linux on x86-64 (glibc 2.35 or later), Windows on x86-64 and macOS on Apple silicon, with the SHA-256 of each in SHA256SUMS.txt. README.md says how to use them."
