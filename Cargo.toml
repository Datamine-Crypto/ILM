[workspace]
resolver = "3"
members = [
    "crates/ilm-core",
    "crates/ilm-data",
    "crates/ilm-eval",
    "crates/ilm-commands",
    "crates/ilm",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"
readme = "README.md"

[profile.test]
opt-level = 3

[profile.release]
debug = false
lto = "fat"
codegen-units = 1

[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 256
incremental = true
